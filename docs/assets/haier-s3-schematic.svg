60,630 575,630"/><text x="100" y="618" font-size="19" text-anchor="start" style="fill:#172b40">TX HAIER →</text><circle cx="430" cy="630" r="4" fill="#263b4c"/><polyline class="w" points="430,630 430,657"/><polyline class="w" points="430,657 430,672"/><rect x="422" y="672" width="16" height="50" fill="white" stroke="#263b4c" stroke-width="2.5"/><polyline class="w" points="430,722 430,737"/><text x="448" y="693" font-size="17" text-anchor="start" style="fill:#172b40">R3</text><text x="448" y="716" font-size="17" text-anchor="start" style="fill:#172b40">20 kΩ</text><polyline class="w" points="430,737 430,749"/><polyline class="w" points="416,749 444,749"/><polyline class="w" points="421,755 439,755"/><polyline class="w" points="426,761 434,761"/><polyline class="w" points="100,700 170,700"/><polyline class="w" points="170,700 170,712"/><polyline class="w" points="156,712 184,712"/><polyline class="w" points="161,718 179,718"/><polyline class="w" points="166,724 174,724"/><text x="100" y="685" font-size="18" text-anchor="start" style="fill:#172b40">GND</text><text x="260" y="788" font-size="18" text-anchor="middle" style="fill:#172b40">+3V3</text><polyline class="w" points="260,800 320,800"/><polyline class="w" points="320,800 335,800"/><rect x="335" y="792" width="50" height="16" fill="white" stroke="#263b4c" stroke-width="2.5"/><polyline class="w" points="385,800 400,800"/><text x="360" y="766" font-size="17" text-anchor="middle" style="fill:#172b40">R1</text><text x="360" y="786" font-size="17" text-anchor="middle" style="fill:#172b40">10 kΩ</text><polyline class="w" points="400,800 575,800"/><polyline class="w" points="575,865 340,865"/><circle cx="340" cy="865" r="4" fill="white" stroke="#263b4c" stroke-width="2"/><circle cx="290" cy="865" r="4" fill="white" stroke="#263b4c" stroke-width="2"/><polyline class="w" points="292,860 333,840"/><polyline class="w" points="290,865 260,865"/><polyline class="w" points="260,865 260,877"/><polyline class="w" points="246,877 274,877"/><polyline class="w" points="251,883 269,883"/><polyline class="w" points="256,889 264,889"/><text x="355" y="896" font-size="17" text-anchor="start" style="fill:#172b40">SB1 · PGM (NO)</text><rect x="1390" y="490" width="200" height="355" fill="white" stroke="#263b4c" stroke-width="2.5"/><text x="1605" y="467" font-size="23" text-anchor="start" style="fill:#172b40">U3  MAX485</text><polyline class="w" points="1350,555 1390,555"/><text x="1380" y="545" font-size="16" text-anchor="end" style="fill:#172b40">4</text><text x="1405" y="562" font-size="20" text-anchor="start" style="fill:#172b40">DI</text><polyline class="w" points="1350,630 1390,630"/><text x="1380" y="620" font-size="16" text-anchor="end" style="fill:#172b40">1</text><text x="1405" y="637" font-size="20" text-anchor="start" style="fill:#172b40">RO</text><polyline class="w" points="1350,755 1390,755"/><text x="1380" y="745" font-size="16" text-anchor="end" style="fill:#172b40">2</text><text x="1405" y="762" font-size="20" text-anchor="start" style="fill:#172b40">/RE</text><polyline class="w" points="1350,790 1390,790"/><text x="1380" y="780" font-size="16" text-anchor="end" style="fill:#172b40">3</text><text x="1405" y="797" font-size="20" text-anchor="start" style="fill:#172b40">DE</text><polyline class="w" points="995,555 1350,555"/><polyline class="w" points="995,630 1180,630"/><polyline class="w" points="1180,630 1195,630"/><rect x="1195" y="622" width="50" height="16" fill="white" stroke="#263b4c" stroke-width="2.5"/><polyline class="w" points="1245,630 1260,630"/><text x="1220" y="596" font-size="17" text-anchor="middle" style="fill:#172b40">R4</text><text x="1220" y="616" font-size="17" text-anchor="middle" style="fill:#172b40">10 kΩ</text><polyline class="w" points="1260,630 1350,630"/><circle cx="1080" cy="630" r="4" fill="#263b4c"/><polyline class="w" points="1080,650 1080,665"/><rect x="1072" y="665" width="16" height="50" fill="white" stroke="#263b4c" stroke-width="2.5"/><polyline class="w" points="1080,715 1080,730"/><text x="1098" y="686" font-size="17" text-anchor="start" style="fill:#172b40">R5</text><text x="1098" y="709" font-size="17" text-anchor="start" style="fill:#172b40">20 kΩ</text><polyline class="w" points="1080,630 1080,650"/><polyline class="w" points="1080,730 1080,742"/><polyline class="w" points="1066,742 1094,742"/><polyline class="w" points="1071,748 1089,748"/><polyline class="w" points="1076,754 1084,754"/><polyline class="w" points="995,790 1310,790 1310,755 1350,755"/><polyline class="w" points="1310,790 1350,790"/><circle cx="1310" cy="790" r="4" fill="#263b4c"/><circle cx="1190" cy="790" r="4" fill="#263b4c"/><polyline class="w" points="1190,790 1190,820"/><polyline class="w" points="1190,820 1190,835"/><rect x="1182" y="835" width="16" height="50" fill="white" stroke="#263b4c" stroke-width="2.5"/><polyline class="w" points="1190,885 1190,900"/><text x="1208" y="856" font-size="17" text-anchor="start" style="fill:#172b40">R6*</text><text x="1208" y="879" font-size="17" text-anchor="start" style="fill:#172b40">10 kΩ</text><polyline class="w" points="1190,900 1190,912"/><polyline class="w" points="1176,912 1204,912"/><polyline class="w" points="1181,918 1199,918"/><polyline class="w" points="1186,924 1194,924"/><polyline class="w" points="1490,490 1490,420"/><text x="1490" y="408" font-size="18" text-anchor="middle" style="fill:#172b40">+5V</text><text x="1505" y="486" font-size="16" text-anchor="start" style="fill:#172b40">8 VCC</text><polyline class="w" points="1490,845 1490,892"/><polyline class="w" points="1490,892 1490,904"/><polyline class="w" points="1476,904 1504,904"/><polyline class="w" points="1481,910 1499,910"/><polyline class="w" points="1486,916 1494,916"/><text x="1510" y="872" font-size="16" text-anchor="start" style="fill:#172b40">5 GND</text><polyline class="w" points="1590,590 1720,590"/><text x="1575" y="597" font-size="20" text-anchor="end" style="fill:#172b40">A</text><text x="1605" y="580" font-size="16" text-anchor="start" style="fill:#172b40">6</text><text x="1720" y="578" font-size="17" text-anchor="end" style="fill:#172b40">RS-485 A</text><polyline class="w" points="1590,690 1720,690"/><text x="1575" y="697" font-size="20" text-anchor="end" style="fill:#172b40">B</text><text x="1605" y="680" font-size="16" text-anchor="start" style="fill:#172b40">7</text><text x="1720" y="678" font-size="17" text-anchor="end" style="fill:#172b40">RS-485 B</text><text x="1390" y="947" font-size="17" text-anchor="start" style="fill:#172b40">DIR: 0 = приём; 1 = передача</text><polyline class="w" points="50,1000 1750,1000"/><text x="50" y="1042" font-size="23" text-anchor="start" style="fill:#172b40">04  ПРОГРАММИРОВАНИЕ И ПРИМЕЧАНИЯ</text><text x="50" y="1085" font-size="20" text-anchor="start" style="fill:#172b40">UART0: GPIO43 / pad 37 (TXD0) → RX адаптера; GPIO44 / pad 36 (RXD0) ← TX адаптера.</text><text x="50" y="1118" font-size="20" text-anchor="start" style="fill:#172b40">Уровни адаптера 3.3 V; общая GND. SB1 замыкает GPIO0 на GND при включении питания.</text><text x="50" y="1156" font-size="20" text-anchor="start" style="fill:#172b40">Оба делителя: 10 kΩ от источника, 20 kΩ к GND. При входных 5.0 V → расчётные 3.33 V.</text><text x="50" y="1189" font-size="19" text-anchor="start" style="fill:#172b40">R6* — предусмотренная подтяжка DIR. Добавить 100 nF между VCC и GND у MAX485.</text><text x="50" y="1222" font-size="19" text-anchor="start" style="fill:#172b40">Для PCB: проверить EN RC, питание/нагрев, терминацию и смещение RS-485; см. SCHEMATIC.md.</text><text x="50" y="1255" font-size="19" text-anchor="start" style="fill:#172b40">Числа у U1 — площадки модуля, не GPIO. Порядок контактов разъёма Haier здесь не задаётся.</text><text x="50" y="1307" font-size="19" text-anchor="start" style="fill:#172b40">dk-1983 / Haier-ESP32-Modbus</text><text x="1750" y="1307" font-size="18" text-anchor="end" style="fill:#172b40">Макет • без гальванической развязки • не чертёж PCB</text></svg>