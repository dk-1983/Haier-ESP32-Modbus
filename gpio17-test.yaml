# Diagnostic only. Disconnect BOTH GPIO17 and GPIO18 from the air conditioner.
# No Haier UART, Modbus, Wi-Fi or MQTT. Restore normal firmware after measurement.
esphome:
  name: haier-s3
  build_path: work/gpio17-test
  project:
    name: local.haier_gpio17_test
    version: 0.6.5-gpio-sequence-test
  includes:
    - gpio_sequence_test.h
  on_boot:
    priority: -100
    then:
      - lambda: haier_gpio_test_step(0);
esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: arduino
psram:
  mode: octal
  speed: 80MHz
logger:
  level: DEBUG
  hardware_uart: UART0
  baud_rate: 115200
interval:
  - interval: 5s
    then:
      - lambda: |-
          static unsigned step = 0;
          step = (step + 1) % 4;
          haier_gpio_test_step(step);
